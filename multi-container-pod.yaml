apiVersion: v1
kind: Pod
metadata:
  name: logger
  namespace: exercise-02
spec:
  volumes:
   -name: log-volume
   -emptyDir: {}
  initContainers:
    name: log-volume
    image: busybox:1.36
    restartPolicy: Always
    command: ["sh","-c", "/var/log/app/app.log"]
    volumeMounts:
      -name: log-volume
       mountPath: /var/log/app
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh","-c", "while true; do echo \"$date - app running\" >> /var/log/app/app.log; sleep 3; done"]
    volumeMounts:
     -name: log-volume
     -mountPath: /var/log/app
status: {}
