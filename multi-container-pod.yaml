apiVersion: v1
kind: Pod
metadata:
  name: logger
  namespace: exercise-02
spec:
  restartPolicy: Always
  volumes:
  - name: log-volume
    emptyDir: {}
  initContainers:
  - name: init-log-volume
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /var/log/app && echo 'init container started' > /var/log/app/app.log"]
    volumeMounts:
    - name: log-volume
      mountPath: /var/log/app
  - name: log-agent
    image: busybox:1.36
    restartPolicy: Always
    command: ["sh", "-c", "tail -f /var/log/app/app.log"]
    volumeMounts:
    - name: log-volume
      mountPath: /var/log/app
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "while true; do date '+%Y-%m-%d %H:%M:%S - app running' >> /var/log/app/app.log; sleep 3; done"]
    volumeMounts:
    - name: log-volume
      mountPath: /var/log/app
