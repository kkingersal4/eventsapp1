apiVersion: v1
kind: Pod
metadata:
  labels:
    run: app
  name: app
spec:
  volumes:
  - name: config-volume
    emptyDir: {}
  containers:
  - image: busybox:1.36
    name: app
    command: ["sleep", "3600"]
    envFrom:
    - configMapRef:
        name: app-config
    - secretRef:
        name: db-creds
    volumeMounts:
    - name: config-volume
      mountPath: /etc/config
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
